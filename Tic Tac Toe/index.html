<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="index.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300&family=Rajdhani:wght@700&display=swap"
        rel="stylesheet">
</head>

<body>
    <header>
        <nav>
            <ul>
                <li>TIC TAC TOE</li>
            </ul>
        </nav>
    </header>
    <main>
        <br>
        <div class="gInfo">
            <div class="Welcome"><img class='winImg' src="excited.gif" alt="unexpected error">
            </div>
            <hr class="hrClass"><br>
            <br>
            <div class="turn"><br>
                Turn for X
            </div>
            <hr class="hrClass"><br>
            <br>
            <button id="reset"><br>Reset</button>
            <!-- <img src="excited.gif" alt="unexpected error"> -->
        </div>

        <div class="gameCont">
            <div class="Game">
                <div class="line"></div>
                <div class="box bord_l bord_t"><span class="boxtext"></span></div>
                <div class="box bord_t"><span class="boxtext"></span></div>
                <div class="box bord_t bord_r"><span class="boxtext"></span></div>
                <div class="box bord_l"><span class="boxtext"></span></div>
                <div class="box"><span class="boxtext"></span></div>
                <div class="box bord_r"><span class="boxtext"></span></div>
                <div class="box bord_l bord_b"><span class="boxtext"></span></div>
                <div class="box bord_b"><span class="boxtext"></span></div>
                <div class="box bord_r bord_b"><span class="boxtext"></span></div>
            </div>

        </div>

    </main>
</body>

</html>
